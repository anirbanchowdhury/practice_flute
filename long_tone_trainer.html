<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Long Tone — Bansuri Practice</title>
<meta name="theme-color" content="#1f1a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1f1a14;
    --surface: #2a2318;
    --surface-2: #342b1c;
    --ink: #efe7d8;
    --ink-dim: #a89a82;
    --brass: #c9a24b;
    --brass-soft: rgba(201,162,75,0.16);
    --teal: #4c8078;
    --teal-soft: rgba(76,128,120,0.18);
    --rust: #c16a4d;
    --rust-soft: rgba(193,106,77,0.18);
    --ring-track: #3a3122;
    --line: #3d3423;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
    position:relative;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 22px 8px;
  }
  .brand-title{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:600;
    display:block;
  }
  .brand-sub{
    font-size:12.5px;
    color:var(--ink-dim);
  }
  .icon-btn{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    width:40px;height:40px;
    border-radius:12px;
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{background:var(--surface-2);}

  /* ---------- svara ladder ---------- */
  .ladder{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px 22px 16px;
    scrollbar-width:none;
  }
  .ladder::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;
    padding:7px 12px;
    border-radius:999px;
    background:var(--surface);
    border:1px solid var(--line);
    font-size:13px;
    color:var(--ink-dim);
    display:flex;
    align-items:center;
    gap:6px;
    transition:background .2s, color .2s, border-color .2s;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);}
  .pill.mandra .dot{background:var(--teal);}
  .pill.madhya .dot{background:var(--brass);}
  .pill.taar .dot{background:var(--rust);}
  .pill.active{
    background:var(--brass-soft);
    border-color:var(--brass);
    color:var(--ink);
    font-weight:600;
  }

  /* ---------- stage ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px 22px 0;
  }
  .ring-wrap{
    position:relative;
    width:min(72vw, 280px);
    height:min(72vw, 280px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .breathe{
    position:absolute;
    inset:8%;
    border-radius:50%;
    background:radial-gradient(circle, var(--brass-soft) 0%, transparent 70%);
    opacity:0;
    transform:scale(0.9);
  }
  .breathe.on{
    animation:breathe 4s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:0.35; transform:scale(0.92);}
    50%{opacity:0.75; transform:scale(1.04);}
  }
  svg.ring{width:100%;height:100%;transform:rotate(-90deg);position:relative;z-index:1;}
  .ring-track{fill:none;stroke:var(--ring-track);stroke-width:7;}
  .ring-fill{
    fill:none;
    stroke:var(--brass);
    stroke-width:7;
    stroke-linecap:round;
    stroke-dasharray:565.48;
    stroke-dashoffset:0;
  }
  .ring-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    z-index:2;
  }
  .saptak-tag{
    font-size:11px;
    letter-spacing:.02em;
    color:var(--ink-dim);
    padding:2px 9px;
    border-radius:999px;
    border:1px solid var(--line);
    margin-bottom:4px;
  }
  .saptak-tag.mandra{color:var(--teal); border-color:var(--teal);}
  .saptak-tag.madhya{color:var(--brass); border-color:var(--brass);}
  .saptak-tag.taar{color:var(--rust); border-color:var(--rust);}
  .saptak-tag.pause{color:var(--ink-dim); border-color:var(--line); font-style:italic;}
  .sargam{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:56px;
    line-height:1;
  }
  .western{
    font-size:13px;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }
  .timer{
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }
  .position{
    margin-top:22px;
    font-size:13px;
    color:var(--ink-dim);
  }

  /* ---------- controls ---------- */
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:26px 22px;
  }
  .ctrl-btn{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    width:52px;height:52px;
    border-radius:50%;
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .ctrl-btn:active{background:var(--surface-2);}
  .ctrl-primary{
    width:68px;height:68px;
    background:var(--brass);
    color:#211b12;
    border:none;
    font-size:22px;
  }
  .ctrl-primary:active{background:#b8923f;}

  /* ---------- streak ---------- */
  .streak{
    display:flex;
    justify-content:center;
    gap:9px;
    padding:0 22px 26px;
  }
  .streak .pip{
    width:8px;height:8px;border-radius:50%;
    background:var(--ring-track);
  }
  .streak .pip.filled{background:var(--brass);}

  /* ---------- settings panel ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,8,5,0.55);
    opacity:0;pointer-events:none;
    transition:opacity .2s;
    z-index:10;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .settings-panel{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:480px;
    margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:22px 22px calc(24px + env(safe-area-inset-bottom,0));
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:11;
    max-height:82vh;
    overflow-y:auto;
  }
  .settings-panel.show{transform:translateY(0);}
  .settings-panel h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 18px;
  }
  .field{margin-bottom:20px;}
  .field label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--ink-dim);
    margin-bottom:8px;
  }
  .field label span.val{color:var(--ink); font-weight:500;}
  select, input[type=range]{
    width:100%;
    accent-color:var(--brass);
  }
  select{
    background:var(--surface-2);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
  }
  .seg{
    display:flex;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .seg button{
    flex:1;
    background:var(--surface-2);
    border:none;
    color:var(--ink-dim);
    padding:10px 6px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  .seg button.active{background:var(--brass); color:#211b12; font-weight:600;}
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .toggle-row span{font-size:14px;}
  .switch{
    width:42px;height:24px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    position:relative;
    cursor:pointer;
  }
  .switch .knob{
    position:absolute;top:2px;left:2px;
    width:18px;height:18px;border-radius:50%;
    background:var(--ink-dim);
    transition:left .15s, background .15s;
  }
  .switch.on{background:var(--brass-soft); border-color:var(--brass);}
  .switch.on .knob{left:20px; background:var(--brass);}
  .done-btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    background:var(--brass);
    color:#211b12;
    font-weight:600;
    font-size:15px;
    margin-top:6px;
    cursor:pointer;
  }

  /* ---------- complete screen ---------- */
  .complete-screen{
    position:fixed;inset:0;
    background:var(--bg);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    z-index:20;
  }
  .complete-screen.show{display:flex;}
  .complete-screen h2{
    font-family:'Fraunces', serif;
    font-size:28px;
    font-weight:600;
    margin:0 0 10px;
  }
  .complete-screen p{
    color:var(--ink-dim);
    font-size:14.5px;
    max-width:280px;
    margin:0 0 26px;
    line-height:1.5;
  }
  .complete-screen button{
    padding:13px 26px;
    border-radius:12px;
    border:none;
    background:var(--brass);
    color:#211b12;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <span class="brand-title">Long Tone</span>
      <span class="brand-sub">bansuri practice · Sa = <span id="saLabel">E</span></span>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Open settings">⚙</button>
  </div>

  <div class="ladder" id="ladder"></div>

  <div class="stage">
    <div class="ring-wrap">
      <div class="breathe" id="breathe"></div>
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="ring-center">
        <span class="saptak-tag" id="saptakTag">madhya</span>
        <span class="sargam" id="sargamLabel">Pa</span>
        <span class="western" id="westernLabel">B3 · 246.9 Hz</span>
        <span class="timer" id="timerLabel">15s</span>
      </div>
    </div>
    <div class="position" id="positionLabel">Note 1 of 15</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Previous note">⏮</button>
    <button class="ctrl-btn ctrl-primary" id="playBtn" aria-label="Play">▶</button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Next note">⏭</button>
  </div>

  <div class="streak" id="streak"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="settings-panel" id="settingsPanel">
  <h3>Settings</h3>

  <div class="field">
    <label>Flute key (Sa)</label>
    <select id="saSelect">
      <option value="60">C</option>
      <option value="61">C#</option>
      <option value="62">D</option>
      <option value="63">D#</option>
      <option value="64" selected>E</option>
      <option value="65">F</option>
      <option value="66">F#</option>
      <option value="67">G</option>
      <option value="68">G#</option>
      <option value="69">A</option>
      <option value="70">A#</option>
      <option value="71">B</option>
    </select>
  </div>

  <div class="field">
    <label>Note set</label>
    <div class="seg" id="noteSetSeg">
      <button data-val="diatonic" class="active">Diatonic · 7 svara</button>
      <button data-val="chromatic">Chromatic · 12 svara</button>
    </div>
  </div>

  <div class="field">
    <label>Practice order</label>
    <select id="orderSelect">
      <option value="asc">Ascending — Pa to Pa</option>
      <option value="desc">Descending — Pa to Pa</option>
      <option value="updown">Up and down</option>
      <option value="random">Random</option>
    </select>
  </div>

  <div class="field">
    <label>Seconds per note <span class="val" id="durationVal">16s</span></label>
    <input type="range" id="durationRange" min="5" max="30" step="1" value="16">
  </div>

  <div class="field">
    <label>Pause between notes <span class="val" id="pauseVal">4s</span></label>
    <input type="range" id="pauseRange" min="0" max="10" step="1" value="4">
  </div>

  <div class="field">
    <div class="toggle-row">
      <span>Reference pitch</span>
      <div class="switch on" id="refToggle"><div class="knob"></div></div>
    </div>
    <input type="range" id="refVolume" min="0" max="1" step="0.05" value="0.5">
  </div>

  <div class="field">
    <div class="toggle-row">
      <span>Continuous Sa drone</span>
      <div class="switch" id="droneToggle"><div class="knob"></div></div>
    </div>
    <input type="range" id="droneVolume" min="0" max="1" step="0.05" value="0.22">
  </div>

  <button class="done-btn" id="closeSettings">Done</button>
</div>

<div class="complete-screen" id="completeScreen">
  <h2>Session complete</h2>
  <p>Every note from lower Pa to high Pa, held steady. Nice breath control.</p>
  <button id="restartBtn">Practice again</button>
</div>

<script>
(function(){
  "use strict";

  var DEGREE_NAMES = ['Sa','re','Re','ga','Ga','Ma','ma','Pa','dha','Dha','ni','Ni'];
  var WESTERN_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var DIATONIC_OFFSETS = [-5,-3,-1,0,2,4,5,7,9,11,12,14,16,17,19];

  function mod12(n){ return ((n % 12) + 12) % 12; }

  function buildOffsets(chromatic){
    if(!chromatic) return DIATONIC_OFFSETS.slice();
    var out = [];
    for(var o=-5; o<=19; o++) out.push(o);
    return out;
  }

  function noteFromOffset(saMidi, o){
    var midi = saMidi + o;
    var freq = 440 * Math.pow(2, (midi - 69) / 12);
    var western = WESTERN_NAMES[mod12(midi)] + (Math.floor(midi/12) - 1);
    var sargam = DEGREE_NAMES[mod12(o)];
    var saptak = o < 0 ? 'mandra' : (o < 12 ? 'madhya' : 'taar');
    return { midi: midi, freq: freq, western: western, sargam: sargam, saptak: saptak, offset: o };
  }

  function buildSequence(saMidi, chromatic){
    return buildOffsets(chromatic).map(function(o){ return noteFromOffset(saMidi, o); });
  }

  function applyOrder(seq, order){
    if(order === 'asc') return seq.slice();
    if(order === 'desc') return seq.slice().reverse();
    if(order === 'updown'){
      var down = seq.slice().reverse().slice(1);
      return seq.concat(down);
    }
    if(order === 'random'){
      var arr = seq.slice();
      for(var i=arr.length-1;i>0;i--){
        var j = Math.floor(Math.random()*(i+1));
        var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
      }
      return arr;
    }
    return seq.slice();
  }

  // ---------- settings ----------
  var DEFAULT_SETTINGS = {
    saMidi: 64,
    chromatic: false,
    order: 'asc',
    duration: 16,
    pauseDuration: 4,
    refOn: true,
    refVolume: 0.5,
    droneOn: false,
    droneVolume: 0.22
  };

  var settings = loadSettings();

  function loadSettings(){
    try{
      var raw = localStorage.getItem('longtone_settings');
      if(!raw) return Object.assign({}, DEFAULT_SETTINGS);
      var parsed = JSON.parse(raw);
      return Object.assign({}, DEFAULT_SETTINGS, parsed);
    }catch(e){ return Object.assign({}, DEFAULT_SETTINGS); }
  }
  function saveSettings(){
    try{ localStorage.setItem('longtone_settings', JSON.stringify(settings)); }catch(e){}
  }

  // ---------- state ----------
  var sequence = [];
  var currentIndex = 0;
  var phase = 'note'; // 'note' | 'pause'
  var elapsed = 0;
  var isPlaying = false;
  var playStartTs = 0;
  var rafId = null;

  var audioCtx = null;
  var toneOsc = null, toneGain = null;
  var droneOsc = null, droneGain = null;

  // ---------- DOM ----------
  var $ = function(id){ return document.getElementById(id); };
  var ladderEl = $('ladder');
  var sargamLabel = $('sargamLabel');
  var westernLabel = $('westernLabel');
  var saptakTag = $('saptakTag');
  var timerLabel = $('timerLabel');
  var positionLabel = $('positionLabel');
  var ringFill = $('ringFill');
  var breatheEl = $('breathe');
  var playBtn = $('playBtn');
  var prevBtn = $('prevBtn');
  var nextBtn = $('nextBtn');
  var saLabel = $('saLabel');
  var streakEl = $('streak');
  var completeScreen = $('completeScreen');

  var CIRC = 2 * Math.PI * 90;

  function rebuildSequence(resetPlayback){
    var base = buildSequence(settings.saMidi, settings.chromatic);
    sequence = applyOrder(base, settings.order);
    if(resetPlayback){
      stopPlayback();
      currentIndex = 0;
      phase = 'note';
      elapsed = 0;
    }
    renderLadder();
    updateDisplay();
  }

  function renderLadder(){
    ladderEl.innerHTML = '';
    sequence.forEach(function(note, i){
      var pill = document.createElement('div');
      pill.className = 'pill ' + note.saptak + (i === currentIndex ? ' active' : '');
      pill.innerHTML = '<span class="dot"></span>' + note.sargam;
      ladderEl.appendChild(pill);
    });
  }

  function updateActivePill(){
    var pills = ladderEl.children;
    for(var i=0;i<pills.length;i++){
      pills[i].classList.toggle('active', i === currentIndex);
    }
    var active = pills[currentIndex];
    if(active){
      active.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    }
  }

  function updateDisplay(){
    var note = sequence[currentIndex];
    if(!note) return;
    sargamLabel.textContent = note.sargam;
    westernLabel.textContent = note.western + ' · ' + note.freq.toFixed(1) + ' Hz';
    saptakTag.textContent = note.saptak;
    saptakTag.className = 'saptak-tag ' + note.saptak;
    positionLabel.textContent = 'Note ' + (currentIndex+1) + ' of ' + sequence.length;
    setRing(0);
    timerLabel.textContent = settings.duration + 's';
    updateActivePill();
    saLabel.textContent = WESTERN_NAMES[mod12(settings.saMidi)];
  }

  function updatePauseDisplay(){
    var upcoming = sequence[currentIndex + 1];
    sargamLabel.textContent = '·';
    saptakTag.textContent = 'breathe in';
    saptakTag.className = 'saptak-tag pause';
    westernLabel.textContent = upcoming ? ('next: ' + upcoming.sargam + ' · ' + upcoming.western) : '';
    positionLabel.textContent = 'Note ' + (currentIndex+1) + ' of ' + sequence.length;
    timerLabel.textContent = settings.pauseDuration + 's';
    setRing(1);
  }

  function setRing(fraction){
    ringFill.style.strokeDashoffset = (CIRC * fraction).toFixed(2);
  }

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startTone(freq, dur, vol){
    stopToneImmediate();
    if(!settings.refOn || vol <= 0) return;
    var now = audioCtx.currentTime;
    toneOsc = audioCtx.createOscillator();
    toneGain = audioCtx.createGain();
    toneOsc.type = 'sine';
    toneOsc.frequency.setValueAtTime(freq, now);
    var attack = Math.min(0.06, dur*0.2);
    var release = Math.min(0.18, dur*0.3);
    toneGain.gain.setValueAtTime(0, now);
    toneGain.gain.linearRampToValueAtTime(vol, now + attack);
    var releaseStart = Math.max(now + attack, now + dur - release);
    toneGain.gain.setValueAtTime(vol, releaseStart);
    toneGain.gain.linearRampToValueAtTime(0, releaseStart + release);
    toneOsc.connect(toneGain).connect(audioCtx.destination);
    toneOsc.start(now);
    toneOsc.stop(now + dur + 0.02);
  }

  function stopToneImmediate(){
    if(toneOsc){
      try{ toneOsc.stop(); }catch(e){}
      toneOsc.disconnect();
      toneOsc = null;
    }
    if(toneGain){ toneGain.disconnect(); toneGain = null; }
  }

  function startDrone(){
    if(!settings.droneOn) return;
    stopDrone();
    var freq = 440 * Math.pow(2, (settings.saMidi - 69) / 12);
    droneOsc = audioCtx.createOscillator();
    droneGain = audioCtx.createGain();
    droneOsc.type = 'sine';
    droneOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
    droneGain.gain.linearRampToValueAtTime(settings.droneVolume, audioCtx.currentTime + 0.4);
    droneOsc.connect(droneGain).connect(audioCtx.destination);
    droneOsc.start();
  }
  function stopDrone(){
    if(droneOsc){
      try{
        droneGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        droneOsc.stop(audioCtx.currentTime + 0.2);
      }catch(e){}
      droneOsc = null; droneGain = null;
    }
  }

  function getPhaseDuration(){
    return phase === 'note' ? settings.duration : settings.pauseDuration;
  }

  function tick(now){
    if(!isPlaying) return;
    var duration = getPhaseDuration();
    var elapsedNow = elapsed + (now - playStartTs) / 1000;
    var remaining = duration - elapsedNow;
    var phaseFraction = Math.min(1, elapsedNow / duration);
    if(phase === 'note'){
      setRing(phaseFraction);
      timerLabel.textContent = Math.max(0, Math.ceil(remaining)) + 's';
    } else {
      setRing(1 - phaseFraction);
      timerLabel.textContent = Math.max(0, Math.ceil(remaining)) + 's';
    }
    if(elapsedNow >= duration){
      phaseComplete();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function playCurrentSegment(){
    ensureAudio();
    var duration = getPhaseDuration();
    var remaining = duration - elapsed;
    if(phase === 'note'){
      var note = sequence[currentIndex];
      startTone(note.freq, remaining, settings.refOn ? settings.refVolume : 0);
      if(settings.droneOn && !droneOsc) startDrone();
    } else {
      stopToneImmediate();
    }
    playStartTs = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function phaseComplete(){
    if(phase === 'note'){
      stopToneImmediate();
      if(settings.pauseDuration > 0){
        phase = 'pause';
        elapsed = 0;
        updatePauseDisplay();
        if(isPlaying) playCurrentSegment();
      } else {
        goToNextIndex();
      }
    } else {
      goToNextIndex();
    }
  }

  function goToNextIndex(){
    phase = 'note';
    elapsed = 0;
    currentIndex++;
    if(currentIndex >= sequence.length){
      finishSession();
      return;
    }
    updateDisplay();
    if(isPlaying) playCurrentSegment();
  }

  function play(){
    if(sequence.length === 0) return;
    isPlaying = true;
    breatheEl.classList.add('on');
    playBtn.textContent = '❚❚';
    playBtn.setAttribute('aria-label','Pause');
    playCurrentSegment();
  }

  function pause(){
    if(!isPlaying) return;
    var now = performance.now();
    elapsed += (now - playStartTs) / 1000;
    isPlaying = false;
    breatheEl.classList.remove('on');
    playBtn.textContent = '▶';
    playBtn.setAttribute('aria-label','Play');
    if(rafId) cancelAnimationFrame(rafId);
    stopToneImmediate();
    stopDrone();
  }

  function stopPlayback(){
    isPlaying = false;
    breatheEl.classList.remove('on');
    if(playBtn){ playBtn.textContent = '▶'; playBtn.setAttribute('aria-label','Play'); }
    if(rafId) cancelAnimationFrame(rafId);
    stopToneImmediate();
    stopDrone();
  }

  function goTo(index){
    if(index < 0 || index >= sequence.length) return;
    var wasPlaying = isPlaying;
    stopPlayback();
    currentIndex = index;
    phase = 'note';
    elapsed = 0;
    updateDisplay();
    if(wasPlaying) play();
  }

  function finishSession(){
    stopPlayback();
    completeScreen.classList.add('show');
    recordStreak();
  }

  function recordStreak(){
    var today = new Date().toISOString().slice(0,10);
    var days = [];
    try{ days = JSON.parse(localStorage.getItem('longtone_streak') || '[]'); }catch(e){}
    if(days.indexOf(today) === -1) days.push(today);
    days = days.slice(-30);
    try{ localStorage.setItem('longtone_streak', JSON.stringify(days)); }catch(e){}
    renderStreak();
  }

  function renderStreak(){
    var days = [];
    try{ days = JSON.parse(localStorage.getItem('longtone_streak') || '[]'); }catch(e){}
    streakEl.innerHTML = '';
    for(var i=6;i>=0;i--){
      var d = new Date();
      d.setDate(d.getDate() - i);
      var iso = d.toISOString().slice(0,10);
      var pip = document.createElement('div');
      pip.className = 'pip' + (days.indexOf(iso) !== -1 ? ' filled' : '');
      streakEl.appendChild(pip);
    }
  }

  // ---------- controls ----------
  playBtn.addEventListener('click', function(){
    if(isPlaying) pause(); else play();
  });
  prevBtn.addEventListener('click', function(){ goTo(currentIndex - 1); });
  nextBtn.addEventListener('click', function(){ goTo(currentIndex + 1); });

  $('restartBtn').addEventListener('click', function(){
    completeScreen.classList.remove('show');
    currentIndex = 0; phase = 'note'; elapsed = 0;
    updateDisplay();
  });

  // ---------- settings panel ----------
  var settingsPanel = $('settingsPanel');
  var overlay = $('overlay');
  function openSettings(){ settingsPanel.classList.add('show'); overlay.classList.add('show'); }
  function closeSettingsFn(){ settingsPanel.classList.remove('show'); overlay.classList.remove('show'); }
  $('settingsBtn').addEventListener('click', openSettings);
  $('closeSettings').addEventListener('click', closeSettingsFn);
  overlay.addEventListener('click', closeSettingsFn);

  var saSelect = $('saSelect');
  saSelect.value = settings.saMidi;
  saSelect.addEventListener('change', function(){
    settings.saMidi = parseInt(this.value, 10);
    saveSettings();
    rebuildSequence(true);
  });

  var noteSetSeg = $('noteSetSeg');
  Array.prototype.forEach.call(noteSetSeg.children, function(btn){
    btn.classList.toggle('active', (btn.dataset.val === 'chromatic') === settings.chromatic);
    btn.addEventListener('click', function(){
      settings.chromatic = (btn.dataset.val === 'chromatic');
      Array.prototype.forEach.call(noteSetSeg.children, function(b){ b.classList.toggle('active', b === btn); });
      saveSettings();
      rebuildSequence(true);
    });
  });

  var orderSelect = $('orderSelect');
  orderSelect.value = settings.order;
  orderSelect.addEventListener('change', function(){
    settings.order = this.value;
    saveSettings();
    rebuildSequence(true);
  });

  var durationRange = $('durationRange');
  var durationVal = $('durationVal');
  durationRange.value = settings.duration;
  durationVal.textContent = settings.duration + 's';
  durationRange.addEventListener('input', function(){
    settings.duration = parseInt(this.value, 10);
    durationVal.textContent = settings.duration + 's';
    saveSettings();
    stopPlayback();
    phase = 'note';
    elapsed = 0;
    updateDisplay();
  });

  var pauseRange = $('pauseRange');
  var pauseVal = $('pauseVal');
  pauseRange.value = settings.pauseDuration;
  pauseVal.textContent = settings.pauseDuration + 's';
  pauseRange.addEventListener('input', function(){
    settings.pauseDuration = parseInt(this.value, 10);
    pauseVal.textContent = settings.pauseDuration + 's';
    saveSettings();
    stopPlayback();
    phase = 'note';
    elapsed = 0;
    updateDisplay();
  });

  function wireSwitch(switchEl, key, onChange){
    switchEl.classList.toggle('on', settings[key]);
    switchEl.addEventListener('click', function(){
      settings[key] = !settings[key];
      switchEl.classList.toggle('on', settings[key]);
      saveSettings();
      if(onChange) onChange();
    });
  }
  wireSwitch($('refToggle'), 'refOn');
  wireSwitch($('droneToggle'), 'droneOn', function(){
    if(!settings.droneOn) stopDrone();
    else if(isPlaying) startDrone();
  });

  var refVolume = $('refVolume');
  refVolume.value = settings.refVolume;
  refVolume.addEventListener('input', function(){
    settings.refVolume = parseFloat(this.value);
    saveSettings();
  });

  var droneVolume = $('droneVolume');
  droneVolume.value = settings.droneVolume;
  droneVolume.addEventListener('input', function(){
    settings.droneVolume = parseFloat(this.value);
    if(droneGain) droneGain.gain.setValueAtTime(settings.droneVolume, audioCtx.currentTime);
    saveSettings();
  });

  // ---------- init ----------
  rebuildSequence(true);
  renderStreak();

  // ---------- PWA install support ----------
  try{
    var manifest = {
      name: "Long Tone — Bansuri Practice",
      short_name: "Long Tone",
      start_url: ".",
      display: "standalone",
      background_color: "#1f1a14",
      theme_color: "#1f1a14",
      icons: [
        {
          src: "data:image/svg+xml," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
            '<rect width="100" height="100" fill="#1f1a14"/>' +
            '<circle cx="50" cy="50" r="34" fill="none" stroke="#c9a24b" stroke-width="7"/>' +
            '<circle cx="50" cy="50" r="6" fill="#c9a24b"/>' +
            '</svg>'),
          sizes: "192x192 512x512",
          type: "image/svg+xml",
          purpose: "any"
        }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  }catch(e){}

  if('serviceWorker' in navigator){
    try{
      var swCode = "self.addEventListener('install', function(e){ self.skipWaiting(); });" +
        "self.addEventListener('activate', function(e){ self.clients.claim(); });" +
        "self.addEventListener('fetch', function(e){" +
        "  e.respondWith(caches.open('longtone-v1').then(function(cache){" +
        "    return cache.match(e.request).then(function(res){" +
        "      var fetchPromise = fetch(e.request).then(function(networkRes){" +
        "        cache.put(e.request, networkRes.clone()); return networkRes;" +
        "      }).catch(function(){ return res; });" +
        "      return res || fetchPromise;" +
        "    });" +
        "  }));" +
        "});";
      var swBlob = new Blob([swCode], { type: 'application/javascript' });
      var swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(function(){});
    }catch(e){}
  }
})();
</script>
</body>
</html>
